name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy

      - name: Install cargo-deny
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@55fe3b63d9612623cc51e6c62d9d62fbcb175fb0 # 2026-09-29T01-25-15Z-55fe3b63
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency policy
        run: cargo deny --locked check all

      - name: Check formatting
        run: cargo +nightly fmt --all --check

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Lint
        run: cargo +nightly clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
