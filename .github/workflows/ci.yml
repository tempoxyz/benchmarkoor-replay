name: CI

permissions: {}

on:
  pull_request:
  push:
    branches:
      - main
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Secure runner
        uses: tempoxyz/gh-actions/actions/secure-runner@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchains
        run: |
          rustup toolchain install stable --profile minimal
          rustup toolchain install nightly --profile minimal --component rustfmt --component clippy

      - name: Install cargo-deny
        uses: tempoxyz/gh-actions/vendor/taiki-e/install-action@947d9a3ccb2425a9c94d563fd721cc0e33c89e26 # 2026-10-15T00-15-06Z-947d9a3c
        with:
          tool: cargo-deny@0.20.2

      - name: Check dependency policy
        run: cargo deny --locked check all

      - name: Check formatting
        run: cargo +nightly fmt --all --check

      - name: Check compilation
        run: cargo check --locked --all-targets

      - name: Lint
        run: cargo +nightly clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked
